mlijeko:
  name: mlijeko
  synonyms: [mlijeko, kravlje mlijeko]
  must_match: [mlijek]
  must_not_match: [loncic, cokolad, cok\b, kakao, sojin, soja, zob, rizin, riza\b, bademov, badem,
                   kokos, kozje, vanilij, jagod, banan, kava\b, kave\b, napitak, napolitank, keks,
                   kras\b, bijela cokolada, prahu, zamjen, zamj\b, nan\b, junior, kiselo, jogurt,
                   sir\b, sladoled, puding, kroasan, croissant, bombon, cokoladic, med\b, sun\b,
                   suncanje, disney, dorina, ciste, cisti, pjena za, ukrasn, proteinsk, kefir, kondenz,
                   lgg\b, aktiv, acidofil, acedofil, kis\b, palacink, protein, cokol, set\b, ker\b, keram]
  unit: l
  default_exclude_variants: [laktoza=bez]
  # zadano trajno 2,8 %; masnoća 2,8-3,8 % je zamjenjiva (svježe i trajno su zasebne vrste)
  default_attributes: {vrsta: trajno, mast: "2.8"}
  substitutes: {mast: ["2.8", "3.2", "3.5", "3.8"]}
  max_pack: 2000
  min_pack: 500
  plausible_per_unit: [0.5, 4]
  attributes:
    mast:
      "0": '(?<![\d.])0(?:\.0)?\s*(%|mm)'
      "0.5": '(?<![\d.])0?\.5\s*(%|mm)'
      "0.9": '(?<![\d.])0?\.9\s*(%|mm)'
      "1.5": '\b1\.5\s*(%|mm)'
      "2.8": '\b2\.8\s*(%|mm)'
      "3.2": '\b3\.2\s*(%|mm)'
      "3.5": '\b3\.5\s*(%|mm)'
      "3.8": '\b3\.8\s*(%|mm)'
    vrsta:
      trajno: '\btrajn|\buht\b|\btr\b'
      svjeze: '\bsvjez|\bsvj\.|\bsv\.'
    laktoza:
      bez: 'bez laktoze|\blf\b|laktoze free'
  # Dukatova linija LAGANO JUTRO je mlijeko bez laktoze; naziv to rijetko izričito kaže
  inferred_attributes:
    laktoza:
      bez: 'lagano jutro'
  loose_produce: false

