# Rječnik osnovnih namirnica (prvi prijedlog, generiran uz pomoć podataka; čeka pregled).
#
# Pravila podudaranja (provjerava ih clean.product_staples pri buildu):
#   synonyms        nazivi koje korisnik može upisati (hr; velika slova i dijakritika nisu bitni)
#   must_match      barem jedan uzorak mora se pojaviti na POČETKU neke riječi u name_norm
#                   (mala slova, bez dijakritika, đ/dj -> d, interpunkcija -> razmak).
#                   Uzorak je RE2 regex (DuckDB, bez lookarounda); prefiks je dovoljan ("brasn" pogađa brasno/brasna),
#                   za kraj riječi napiši \b.
#   must_not_match  nijedan uzorak se ne smije pojaviti na početku riječi (isti oblik),
#                   uz zajedničke iz _defaults (osim ako namirnica ima no_defaults: true)
#   unit            jedinica usporedbe cijene: kg | l | kom
#   attributes      ime -> {vrijednost: regex}. Python re (smije lookbehind), na "attr tekst": mala slova,
#                   bez dijakritika, đ/dj -> d, zarez -> točka, interpunkcija ostaje
#                   ("Mlijeko 2,8%MM" -> "mlijeko 2.8%mm"). Prva vrijednost koja pogodi pobjeđuje.
#   plausible_per_unit [min, max] € po jedinici usporedbe; cijene izvan su price_suspect
#   plausible_by    {atribut: {vrijednost: [min, max], _other: [min, max]}}: granice po vrijednosti atributa
#                   (pileća prsa svježa/smrznuta, jaja bio/ostala); zamjenjuje plausible_per_unit
#   plausible_per_pack [min, max] € po vrećici (samo uz compare_by: pack): skupo je sve iznad max, a jeftino
#                   samo pojedinačna vrećica ispod min (rinfuza i višestruka pakiranja smiju biti jeftinija)
#                   (ne ulaze u raspon cijena ni u plan_basket)
#   min_pack, max_pack  dopušteno pakiranje u g/ml/kom (porcije i ugostiteljska pakiranja ispadaju)
#   default_exclude_variants  ["atribut=vrijednost", ...] isključeno ako nije izričito traženo
#   compare_by      unit (zadano, cijena po kg/l/kom) | pack: cijena po vrećici, a vrećica je proizvod kakav
#                   se prodaje (broj vrećica iz naziva: "5+1", "3 PAK", "6x8g", inače 1); sachet_g (i sachet_g_by,
#                   npr. svježi kvasac 42 g) služi samo za pretvorbu grama iz recepta u vrećice
#   pantry          začini i sl.: u košarici se računa samo utrošeni dio (cost_used)
#   compare_by: count + count_regex  cijena po komadu iz broja u nazivu ("10/1", "10 KOM")
#   group_by        atribut ili popis atributa po kojima se grupira umjesto EAN-a (jaja: [velicina, uzgoj])
#   require_any     dodatni uzorci: barem jedan mora pogoditi (npr. dio mesa: but, vrat...)
#   default_attributes  zadani filtar ako atribut nije zadan (mljeveno meso: vrsta=mijesano)
#   default_preference {atribut: [vrijednosti]}: zadani redoslijed kad atribut nije tražen (prva dostupna)
#   substitutes     {atribut: [vrijednosti]}: zamjenjive vrijednosti (mlijeko: mast 2.8 = 3.2 = 3.5 = 3.8)
#   disabled        namirnica postoji, ali nije u v1 (ne gradi se i ne može se tražiti)
#   attributes._default  vrijednost atributa kad nijedan uzorak ne pogodi
#   require_pack    uzorci (name_norm, početak riječi): proizvod koji ih pogađa ispada samo ako nema gramature
#                   (prazna soljenka), drop_reason = 'bez_gramature'
#   packaged        {pattern, default_g}: pakirana roba na vagu bez gramature u nazivu (luk RUKAVAC 4/1)
#                   dobiva pretpostavljenu masu, uz unit_confidence=low i pack_source=assumed
#   inferred_attributes  atribut zaključen iz naziva linije (LAGANO JUTRO -> laktoza=bez), u izlazu
#                   označen kao "inferred"
#   assume_piece    proizvod bez gramature koji se ne prodaje na vagu dobiva masu komada iz data/units.yaml
#                   (pieces), npr. vezica peršina 50 g, uz unit_confidence=low i pack_source=assumed
#   piece_g         (zastarjelo) masa komada; mase komada su u data/units.yaml (pieces). Ovo polje je samo rezerva:
#                   masa jednog komada u g, za recepte u komadima ("2 luka"; češnjak: jedan češanj)
#   ambiguous_form  oblik (atribut oblik: konzerva/suho/smrznuto/svjeze) bitno mijenja proizvod; košarica
#                   bez zadanog oblika bira najjeftiniji i upozorava
#   dry_rule        {pack_g: [min, max], unit: [...], words: [...]}: oblik=suho kad naziv ne kaže oblik, pakiranje
#                   je u rasponu, nema oznake konzerve/smrznutog (ni u stupcu unit), a unit ili naziv pogađa popis
#                   (how = heuristic). Oznake konzerve i smrznutog provjeravaju se i u stupcu unit.
#   form_staples    oblik namirnice je druga namirnica (rajčica: svjeze/konzerva/pasirana/koncentrat)
#   loose_produce   svježe voće/povrće. Dodatno pravilo: riječ namirnice je prva ili druga riječ
#                   naziva, a proizvod je bez globalnog EAN-a (vaga/PLU), bez gramature ili >= 500 g,
#                   i nije tekućina (inače "banana" pogađa bombone i sokove s okusom banane)
#
# Grupa proizvoda (isti EAN) pripada namirnici ako barem jedan njezin naziv prolazi pravila,
# a nijedan ne pogađa must_not_match.

