  synonyms: [matovilac, motovilac]
  must_match: [matovil, motovil]
  must_not_match: [sjeme, sjem\b, mix\b, radic]
  unit: kg
  loose_produce: true

radic:
  name: radič
  synonyms: [radič, radic, cikorija]
  must_match: [radic\b, radica\b, cikorij]
  must_not_match: [sjeme, sjem\b, kava, zamjen, kavovin, matovil, radicant]
  unit: kg
  loose_produce: true

endivija:
  name: endivija
  synonyms: [endivija, frizé, frise]
  must_match: [endivij, frisee, frize\b]
  must_not_match: [sjeme, sjem\b, radic]
  unit: kg
  loose_produce: true

spinat:
  name: špinat
  synonyms: [špinat, spinat, blitva]
  must_match: [spinat, blitv]
  must_not_match: [smoothie, tagliatell, losos, piletin, brancin, fortia, tortelin, tortellin, burek, pita, savijac, njoki, tjestenin, rezanc, krem\b, juha,
                   pizza, lazanj, lasagn, sir\b, palacink, rolat]
  unit: kg
  attributes:
    oblik:
      smrznuti: '\bsmrz|\bledo|\bduboko'
      baby: '\bbaby|\bmladi'
  loose_produce: true

celer:
  # Korak 10: stabljika ili korijen; bez vrste se ne pogađa. Uz luk i mrkvu (soffritto, bolonjez) zadano je
  # stabljika, inače ask_user. "Celer list" u trgovinama je svežanj stabljika s lišćem (stabljika); "korijen +
  # list" je korijen. Proizvod bez oznake ("Celer", "CELER 500g") samo kao rezerva, nije zadani izbor.
  name: celer (stabljika ili korijen)
  synonyms: [celer, celera]
  must_match: [celer]
  must_not_match: [sjeme, sok\b, salata, ribani, rezani, granul, zacin, liker, celery, ukis, kis\b, smrz, mix\b,
                   povrce, sol\b, cips, chips]
  unit: kg
  default_exclude_variants: [vrsta=nepoznato]
  assume_piece: true  # svežanj bez težine: 450 g (data/units.yaml, pieces.celer.pack_g)
  ask_attribute:
    attr: vrsta
    values: [stabljika, korijen]
    default_with: {stabljika: [luk, mrkva]}
  attributes:
    vrsta:
      korijen: '\bkorijen|\bkorjen|\bkor\.|\bglava|\bgomolj'  # prije lista: "Celer korijen list" je korijen
      stabljika: '\bstablj|\bstapic|\blist|\brebras'
      _default: nepoznato
  value_words:
    vrsta:
      stabljika: [stabljika, stabljike, stabljiku, stabljikama, rebraš, list]
      korijen: [korijen, korjen, gomolj, glava]
  loose_produce: true

# Korak 10: česti sastojci hrvatskih recepata koji nisu bili namirnice (popis u docs/10_STATUS.md)
mahune:
  name: mahune (zelene ili žute)
  synonyms: [mahune, mahuna, grah mahune, grah mahunar, boranija]
  must_match: ['mahun[ae]\b', mahun\b]
  must_not_match: [mahunark, vanilij, puretin, piletin, cereali, zitar, mjesav, mix\b, poke, varivo, juha, salata,
                   sjeme, hrana, bowl, rizoto, gulas, edamame, soja]
  unit: kg
  min_pack: 200
  max_pack: 3000
  # zadano svježe ili smrznute (ista količina u receptu); konzerva (ocijeđena masa) samo na zahtjev
  default_exclude_variants: [oblik=konzerva]
  attributes:
    oblik:
      konzerva: '\blim\.|\blimenk|\blim\b|\bkonz|\bocij|\bocj|\bstaklo|\bstaklenk|\bsteriliz|\d+\s*(?:g|gr)\.?\s*/\s*\d+|\d\s*ml\b'
      smrznuto: '\bsmrz|\bledo\b|\bfrozen|\bfrozy|\bfresco|\bvapeur|\bzamrz'
      _default: svjeze
    boja:
      zelena: '\bzel'
      zuta: '\bzut'
  value_words:
    oblik:
      smrznuto: [smrznute, smrznuta, smrznutih]
      konzerva: [konzerva, konzervirane]
    boja:
      zelena: [zelene, zelena]
      zuta: [žute, žuta, zute, zuta]
  loose_produce: false

poriluk:
  name: poriluk
  synonyms: [poriluk, praziluk, prasa]
  must_match: [poriluk, praziluk]
  must_not_match: [juha, krem\b, pita, porilukom, poriluka, tavu, sjeme, umak]
  unit: kg
  loose_produce: true

cvjetaca:
  name: cvjetača
  synonyms: [cvjetača, cvjetaca, karfiol]
  must_match: [cvjetac, karfiol, kaul\b]
  must_not_match: [juha, krem\b, salata, salatu, medaljon, nugg, mjesav, mix\b, brokul, curry, gastro, povrc, sjeme, pire]
  unit: kg
  assume_piece: true  # glavica bez težine ("CVJETAČA KOM"): data/units.yaml
  attributes:
    oblik:
      smrznuto: '\bsmrz|\bledo\b|\bfrozen|\bfrozy|\bzamrz'
    vrsta:
      romanesco: '\bromanesc'
  default_exclude_variants: [vrsta=romanesco]
  loose_produce: false

brokula:
  name: brokula
  synonyms: [brokula, brokulu, brokule]
  must_match: [brokul]
  must_not_match: [juha, krem\b, klice, gratin, medaljon, heljd, mjesav, mix\b, cvjetac, karfiol, tjestenin, kasic,
                   salata, pire, rizoto, sjeme, brokulom, aranc, crousti, filet, patate, nugg, brok\b]
  unit: kg
  assume_piece: true
  attributes:
    oblik:
      smrznuto: '\bsmrz|\bledo\b|\bfrozen|\bfrozy|\bvapeur|\bzamrz|o.plant'
  loose_produce: false

patlidzan:
  name: patlidžan
  synonyms: [patlidžan, patlidzan, melancana, melanzana]
  must_match: [patlidzan, melancan]
  must_not_match: [ajvar, namaz, umak, filet, fil\b, ulju, pecen, salata, pasta, sjeme]
  unit: kg
  loose_produce: true

persin:
  name: peršin
  synonyms: [peršin, persin]
  must_match: [persin]
  must_not_match: [sir\b, meki, hren, origano, zac\b, susen, zacin, kotanyi, safram, sjeme, maestro,
                   ulje, maslac, krumpir]
  # svježe bilje: cijena po kg, u košarici se računa utrošeni dio; vezice bez težine se ne pretvaraju
  # (nemaju cijenu po kg, a "1 vezica" u receptu nema pretpostavljenu masu)
  unit: kg
  pantry: true
  # zadano list; korijen samo kad ga recept traži ("peršin korijen"); naziv bez oznake je list
  default_attributes: {dio: list}
  # vezica bez težine: procjena 50 g (data/units.yaml, pieces.persin), unit_confidence=low
  assume_piece: true
  attributes:
    dio:
      korijen: '\bkorijen|\bkorjen|\bberlinsk'
      list: '\blist|\blisnat'
      _default: list
  loose_produce: true

gljive:
  name: gljive (šampinjoni)
  synonyms: [gljive, šampinjoni, sampinjoni, bukovače, bukovace]
  must_match: [sampinjon, gljiv, bukovac]
  must_not_match: [ledo, mjesav, ragu, namaz, povrc, juha, umak, pizza, rizoto, krem\b, pasteta, ocijed, masa\b, mase\b, limenk, lim\b,
                   staklo, konzerv, susen, tortelin, tortellin, burek, pita, salata, kocka, zacin]
  unit: kg
  ambiguous_form: true
  genitive: gljiva  # "Bez gljiva: ..." (summary_hr)
  attributes:
    oblik:
      konzerva: '\blim\.|\blimenk|\blim\b|\bkonz|\bocij|\bocj|\boc\.|\boc\.?\s?masa|\bo\.m\.|\bstaklo|\bstaklenk|\btetra|\bkuhan|\bvakum|\bvak\b|\bnaljev|netto|neto|\d+\s*(?:g|gr)\.?\s*/\s*\d+'
      smrznuto: '\bsmrz|\bledo\b|\bduboko|\bfrozen|\bfrozy|\bfresco|\bzamrz'
      suho: '\bsuh|\brinfuz|\bvrecic|\bpvc\b'
      svjeze: '\bsvjez|\bsvj\.|\brfz\b|\brfs\b|\bpodloz|bez korijena'
      _default: nepoznato
    vrsta:
      sampinjoni: '\bsampinjon'
      bukovace: '\bbukovac'
  loose_produce: true

riza:
  name: riža
  synonyms: [riža, riza]
  must_match: [riza\b, rize\b, rizi\b, riso\b, rice\b]
  must_not_match: [tjestenin, vermicelli, noodle, plodovi, pah\b, rizolino, ling\b, rizling, vino,
                   cokolad, cok\b, kreker, snack, mlijek, napitak, hipp, kasica, vafl, keks, pahuljic,
                   puding, ocat, sake, chips, kolac, sushi set, mikado, pedigree, frutek, povrce,
                   piletin, kuhan, salata, napolitank, galet, tortil, brasno]
  unit: kg
  default_exclude_variants: [vrsta=integralna]
  max_pack: 5000
  min_pack: 250
  attributes:
    vrsta:
      basmati: '\bbasmati'
      jasmin: '\bjasmin'
      arborio: '\barborio'
      carnaroli: '\bcarnaroli'
      originario: '\boriginario|\bokrugl|\bokr\.|kratko zrno|kratkog zrna'
      parboiled: '\bpara?boil'  # i "PARABOILED" (Ben's)
      integralna: '\bintegral|\bintegr\.|\bsmed|\bbrown'
      dugo_zrno: 'dugo zrno|dugog zrna|dugoga zrna|dugo zrna|\bdugo z\.|\bdugozrn|long grain'
  loose_produce: false

tjestenina:
  name: tjestenina
  synonyms: [tjestenina, pasta, špageti, spageti, penne, fusilli, makaroni,
             # Korak 9: oblici kao sinonimi, inače idu u free_text bez zadanih isključenja ("tagliatelle" -> VERDI)
             tagliatelle, rezanci, široki rezanci, uski rezanci, fettuccine, pappardelle, lazanje, lasagne, farfalle, leptirići, mašnice, linguine, bucatini,
             fusili, svrdlići, pužići]
  must_match: [tjestenin, spaget, spaghett, penne, fusill, makaron, tagliatell, farfalle, rigatoni,
               linguine, tortiglioni, puzic, svrdl, mascice, leptiric, pipe rigate, sedanini, tjest\b,
               # Korak 2E: oblici i marke (lazanje su sada tjestenina; gotova jela isključuju gotov/bolognese/smrz)
               cavatappi, elicoidali, elicodiali, gomiti, zlatica, rezanc, pipette, fusil, fuzi, spirali,
               lasagn, lazanj, conchiglie, skoljk, tj\b,
               # Korak 4B: ljiljani samo uz tjesteninu ("AGAPANTHUS / afrički ljiljan" je biljka)
               'ljiljani\b.* (?:tj|tijesto|tjestenin|klara)|(?:tj|tijesto|tjestenin|klara).* ljiljani\b']
  must_not_match: ['tal?ianetta', napolitana, juha, instant, bolognese, piletin, goved, kokosj, salata,
                   umak, gotov, sira\b, punjen, tortelin, tortellin, ravioli, njoki,
                   maggi, carbonara, pesto, mesn, sir\b, skus, tuna, povrce,
                   # mesni rezanci i školjke (morski plodovi), smrznute lazanje
                   pilec, pilet, junec, svinj, purec, dagnj, kamenic, vongol, plodovi mora, morsk, smrz,
                   # "školjke" i "tj" koje nisu tjestenina; gotove lazanje
                   cappasante, pral\b, pralin, sokn, carap, noz\b, pjescanik, pijescanik, zitn, chocapic, cok\b,
                   za tj\b, argan, bolog, meso\b, zamrz, ricott, krupica durum,
                   # Korak 9: stroj za rezance, kadaif (tijesto za kolače), smrznute gotove lazanje (Condeli)
                   stroj, kadaif, condeli]
  unit: kg
  # Korak 9: zadano obična tjestenina; ostale vrste samo na zahtjev (stvarni test 27.10.2026.: "tagliatelle" su u
  # Plodinama bile TAGLIATELLE VERDI, u Konzumu od pira, u Eurospinu i Kauflandu s jajima)
  default_exclude_variants: [vrsta=bez_glutena, vrsta=od_mahunarki, vrsta=integralna, vrsta=od_pira,
                             vrsta=sa_spinatom, vrsta=obojena, vrsta=s_jajima, vrsta=svjeza]
  # Korak 9 (ispravak): tagliatelle (i fettuccine, pappardelle) i lazanje su uobičajeno s jajima, pa za te oblike
  # s jajima nije posebna vrsta; za ostale oblike ostaje na zahtjev
  default_exclude_unless:
    vrsta=s_jajima: {oblik: [tagliatelle, lazanje]}
  max_pack: 5000
  min_pack: 250
  attributes:
    oblik:
      # bucatini i linguine prije špageta ("SPAGHETTI BUCATINI" je bucatini); spageti uključuje spagetine
      bucatini: '\bbucatin'
      linguine: '\blinguin'
      spageti: '\bspaget|\bspaghett|\bspagetin'
      penne: '\bpenne'
      fusilli: '\bfusill|\bsvrdl'
      makaroni: '\bmakaron'
      # Korak 9: nisu svi "rezanci" tagliatelle: jušni i sitni (i kritharaki, orzo) te azijski rezanci su zasebni
      # oblici i biraju se samo kad su traženi (Lidl je za "tagliatelle" dao Kritharaki rezance)
      jusni: '\bjus|\bza juhu|\bsitn|\bfidelin|\bfilin|\bcipkast|\bkritharak|\borzo\b'
      azijski: '\bjapan|\bsoba\b|\budon|\bramen|\bwok\b|\bkonjak|\bkonjac|\bmie\b|\byakisob|\bchow'
      tagliatelle: '\btagliatell|\brezanc|\bfettucc|\bpappardell'
      # poslije tagliatelle: "TAGLIATELLE NO 10 ISTARSKE LAZANJE" su tagliatelle
      lazanje: '\blasagn|\blazanj'
      farfalle: '\bfarfalle|\bleptir|\bmasnic'
      puzici: '\bpuzic'
    # prva vrijednost koja pogodi pobjeđuje: "BEZ GLUTENA KUKURUZNI" je bez_glutena, "SA ŠPINATOM I JAJIMA" sa_spinatom
    vrsta:
      # i heljda, kukuruz i riža (rižini rezanci inače pogađaju tagliatelle preko "rezanci")
      bez_glutena: 'bez glutena|gluten free|\bbg\b|\bb\.g\.|\bheljd|\bkukuruz|\briz(?:a|e|in|\b)|\brice\b'
      od_mahunarki: '\bleca\b|\bcrvena leca|\bslanut|\bgrah\b|\bedamam|\bprotein'
      integralna: '\bintegral|\binte?\.|\bint\b'  # "TJE.INTE.PENNE", "BIO TJ INT SPIRELLI"
      od_pira: '\bpir\b|\bpira\b|\bpirov|\bpirin|\bspelt|\bdinkel|\bkamut'
      # i kratice: "ŠPIN.", "ŠPINA", "ZELE.", "ZEL.", tipfeler "ŠIPNAT"
      sa_spinatom: '\bspin|\bsipnat|\bzel(?:en|e\.|\.|\b)|\bverdi\b'
      # s okusom ili bojom: tricolore, cikla, crnilo sipe, crni, tartuf, rajčica, mrkva, chili, gljive, šparoge
      obojena: '\btricolor|\bcikl|\bcrnil|\bcrn|\bnero di sep|\bsip[ae]\b|\btartuf|\bpomodor|\brajcic|\bmrkv|\bmrk\b|\bchili|\bpaprik|\bgljiv|\bsparog|\bzacinj|\bchlorel|\bchiorel'
      # svježa (hladnjak), i s jajima: prije s_jajima, jer jaja kod tagliatelle više nisu isključena, a svježa jesu;
      # "sa svjež. jajima" je suha tjestenina sa svježim jajima, ne svježa
      svjeza: '\bsvjez(?!\w*\.? jaj)|\bsvj\b(?!\.? jaj)|\bsvj\.(?! ?jaj)|\bsv\.(?! ?jaj)|\bfresc|\bfresh'
      # "S JAJ", "s jaji.", "JAJ.", "JAJA", "s.j."; "BEZ JAJA" i "b.j." nisu s jajima
      s_jajima: 's jaj|(?<!bez )\bjaj(?:a\b|i\b|\.|\b)|\bjajim|\bjajc|\bjajn|\buovo|\beier|\bs\.j\.'
  value_words:
    oblik:
      tagliatelle: [rezanci, široki rezanci, uski rezanci, fettuccine, pappardelle]
      lazanje: [lasagne, lazanja, lasagna]
      jusni: [jušni, jušne, za juhu, sitni]
      farfalle: [leptirići, mašnice]
      fusilli: [fusili, svrdlići]
      puzici: [pužići]
    vrsta:
      integralna: [integralni, integralne, integralnih, integralnu]
      bez_glutena: [bezglutenski, bezglutenska, bezglutenske, bezglutenskih]
      od_mahunarki: [proteinski, proteinska, proteinske, od leće, od slanutka]
      od_pira: [pirovi, pirova, pirove, pir, od pira, spelt]
      sa_spinatom: [zeleni, zelene, zelena, verdi, špinatom]
      obojena: [tricolore, tricolori, šareni, šarene, šarena]
      s_jajima: [jajčani, jajčana, jajčane, jajčanih, jajima]
      svjeza: [svježi, svježa, svježe, svježih]
  loose_produce: false

