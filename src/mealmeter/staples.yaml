brasno:
  name: brašno
  synonyms: [brašno, brasno, pšenično brašno, psenicno brasno]
  must_match: [brasn, bras\b]
  must_not_match: [toast, brasnom, kokos, rizin, zob, badem, slanut, kestenj, chia, lanen, konoplj, mix\b,
                   mjesavin, smjes, keks, kruh, pecivo, palacink, tortilj, napolitank]
  unit: kg
  # vrsta: zadano pšenično; kukuruzno, pirovo, raženo i heljdino samo na zahtjev
  default_exclude_variants: [tip=integralno, gluten=bez, vrsta=kukuruzno, vrsta=pirovo, vrsta=razeno, vrsta=heljdino]
  max_pack: 5000
  min_pack: 500
  plausible_per_unit: [0.4, 6]
  attributes:
    tip:
      glatko: '\bglatk|\bgl\.'
      ostro: '\bostr'
      polubijelo: '\bpolubijel'
      integralno: '\bintegral|\bcrn'
    vrsta:
      pirovo: '\bpir'
      razeno: '\braz'
      kukuruzno: '\bkukuruz'
      heljdino: '\bheljd'
      psenicno: '\bpsen|\bpse\b'
      _default: psenicno
    gluten:
      bez: 'bez glutena|gluten free|\bschar|\bschär'
    oznaka:
      t400: '\bt\s*-?\s*400'
      t550: '\bt\s*-?\s*550|\btip\s*550'
      t850: '\bt\s*-?\s*850'
      t1100: '\bt\s*-?\s*1100'
      "00": '\btip\s*00\b|\(00\)'
  loose_produce: false

secer:
  name: šećer
  synonyms: [šećer, secer]
  must_match: [secer\b]
  must_not_match: [naranc, kokos, kukur, natreen, nescafe, 3u1, sladil, bez\b, vanilin, manje\b, dodan,
                   napitak, keks, bombon, vata, sirup, sok\b, cola, pepsi, cokolad, kukuruz, bonduelle,
                   cimet, rum\b, limun, aroma,
                   # Korak 4B (smoke): brezov šećer (ksilitol) i eritritol nisu šećer
                   brezin, brezov, xylit, ksilit, eritrit, erythrit]
  unit: kg
  default_exclude_variants: [vrsta=smedi, vrsta=u_prahu, vrsta=kocke]
  max_pack: 5000
  min_pack: 250
  plausible_per_unit: [0.6, 8]
  attributes:
    vrsta:
      u_prahu: 'u prahu'
      smedi: '\bsmed|\bdemerara|\btrsk'
      kocke: '\bkock'
      bijeli: '\bbijel|\bkristal'
      _default: bijeli
  loose_produce: false

sol:
  name: sol
  synonyms: [sol, kuhinjska sol]
  must_match: [sol\b]
  must_not_match: [junec, telec, but\b, odresc, pivo, alc, nitrit, ambre, sprej, spf, sun\b, mlijeko,
                   elephant, flat\b, chilli, chili, papar, set\b, mlinac, posuda, bocic, doza, finish,
                   somat, perilic, ocat, ulje, kupanje, naocal, suncan, med\b]
  # soljenka sa sadržajem ("SOL MORSKA SITNA 250G SOLJENKA") je sol; prazna soljenka nema gramaturu
  require_pack: [soljenk]
  unit: kg
  default_exclude_variants: [vrsta=himalajska, vrsta=smanjeni_natrij]
  pantry: true
  max_pack: 5000
  min_pack: 250
  plausible_per_unit: [0.2, 8]
  attributes:
    vrsta:
      smanjeni_natrij: 'manje natrija|smanj\w*\.? udjel\w* natrij|\bnatrij|\bkalij'
      morska: '\bmorsk'
      himalajska: '\bhimalaj'
      kamena: '\bkamen'
      jodirana: '\bjodir'
    zrno:
      sitna: '\bsitn'
      krupna: '\bkrupn'
  loose_produce: false

ulje:
  name: ulje (suncokretovo/biljno)
  synonyms: [ulje, suncokretovo ulje, biljno ulje, jestivo ulje]
  must_match: [ulje\b]
  must_not_match: [edm, masli, djev, devic, za kos, kosu\b, kose\b, djec, tijelo, sun\b, suncan, spf,
                   namjest, ciscen, incun, filet, maslin, masl\b, mas\b, tuna, sardin, fileti, skus,
                   usne, baby, argan, etericn, spreju, bucin, palmin, lanen, ocat, set\b, kozm, motor,
                   lampe, masaz]
  unit: l
  default_exclude_variants: [vrsta=avokado, vrsta=sezam, vrsta=kokos, vrsta=grozde, vrsta=specijalno,
                             vrsta=omegol, vrsta=mediteran, presanje=hladno]
  max_pack: 5000
  min_pack: 500
  plausible_per_unit: [1, 12]
  attributes:
    vrsta:
      # specijalna ulja: postoje, ali nisu zadani izbor (default_exclude_variants)
      avokado: '\bavokad|\bavocad'
      sezam: '\bsezam|\bsesam'
      kokos: '\bkokos|\bcoco'
      grozde: '\bgrozd|\bkostic\w* grozd|\bgrape'
      specijalno: '\bpistacij|\bkonoplj|\borah|\bkikiriki|\bbadem|\bljesnjak|\bcrni kim|\bchia|\bmakov'
      # mješavine Zvijezde: postoje, ali nisu zadani izbor
      omegol: '\bomegol'
      mediteran: '\bmediteran'
      suncokretovo: '\bsuncokret|\bsunc\b'
      repicino: '\brepic|\buljane repice'
      biljno: '\bbiljn|\bbilj\b'
    presanje:
      hladno: '\bhladno pres|\bhl\.? ?pres|\bcold press'
  loose_produce: false

maslinovo_ulje:
  name: maslinovo ulje
  synonyms: [maslinovo ulje, maslinovo]
  must_match: [maslinovo ulje, ulje maslinovo, masl ulje, ulje masl, ekstra devicansko, extra devicansko,
               extra virgin]
  must_not_match: [grissin, okus, tartuf, umak, kruh, pecivo, kreker, tuna, sardin, fileti, skus, inci, masline\b, rajcic, ocat, set\b, sapun, krema,
                   kupus, kis, salat, tarall, focacc,
                   # Korak 4B (smoke): "TOST S MASL.ULJEM" je kruh s maslinovim uljem
                   tost, uljem]
  unit: l
  max_pack: 5000
  min_pack: 250
  plausible_per_unit: [4, 60]
  attributes:
    kvaliteta:
      ekstra_djevicansko: '\bekstra|\bextra|\beks\.|\bekst'
      djevicansko: '\bdevic|\bdev\.'
  loose_produce: false

maslac:
  name: maslac
  synonyms: [maslac, puter, butter, kravlji maslac, ghee, pročišćeni maslac]
  must_match: [maslac, puter\b, butter\b, markenbutter]
  must_not_match: [povrc, mjesavin, focacc, pistacij, toast, tikva, salata, tost, bombon, candie,
                   zacinsk, bilj, peanut, snickers, kikiriki, kokic, keks, croissant, kroasan, shea,
                   kakao, namaz, mikrovaln, smokic, caj\b, pop\b, crunchy, bobi, buttons, slani stapic,
                   biskvit, popcorn, tijest,
                   biljn, vegan, greenvie, green vie, zamjen]
  unit: kg
  max_pack: 1000
  min_pack: 100
  plausible_per_unit: [6, 40]
  # Korak 9: zadano kravlji maslac; kozji, ovčji, ghee i bez laktoze samo kad su izričito traženi
  # (stvarni test 27.10.2026.: "maslac" u Plodinama je bio MASLAC KOZJI 125 G)
  default_exclude_variants: [vrsta_mlijeka=kozje, vrsta_mlijeka=ovcje, vrsta_mlijeka=bivolje, laktoza=bez,
                             vrsta=ghee]
  attributes:
    vrsta:
      ghee: '\bghee|\bprociscen'
      slani: '\bslan|\bs morskom'
      neslani: '\bneslan'
    # Korak 9: mlijeko koje nije kravlje (zajedničko za mliječne namirnice); Capra Domestica, Caprodur su kozji,
    # paški sir je ovčji
    vrsta_mlijeka: &vrsta_mlijeka
      kozje: '\bkoz(?:j|ij|\.|\b)|\bcapr'
      ovcje: '\bovc|\bpask'
      bivolje: '\bbivol|\bbufal'
    # "BEZ LAKT.", "LF", "LACTOSE FREE", Kauflandova linija K-free, Free Zone
    laktoza: &laktoza
      bez: 'bez lakt|\blf\b|lakto?z\w* free|lactose free|\bkfree|\bfree zone|\bfree from|\bzero lakt'
  # riječi u nazivu sastojka ("kozji maslac", "maslac bez laktoze")
  value_words: &mlijecne_rijeci
    vrsta_mlijeka:
      kozje: [kozji, kozja, kozje, kozjeg, kozjim, kozjem]
      ovcje: [ovčji, ovčja, ovčje, ovčjeg, ovčjim, ovčjem]
      bivolje: [bivolji, bivolja, bivolje, bivoljeg, bivoljim, bufala, bufale, buffalo]
    laktoza:
      bez: [bez laktoze, bezlaktozni, bezlaktozna, bezlaktozno]
  loose_produce: false

margarin:
  name: margarin
  synonyms: [margarin]
  must_match: [margarin, margo\b, rama\b]
  must_not_match: []
  unit: kg
  max_pack: 1000
  min_pack: 200
  loose_produce: false

svinjska_mast:
  # Korak 10
  name: svinjska mast
  synonyms: [svinjska mast, mast, domaća mast, domaca mast]
  must_match: [mast\b]
  must_not_match: [biljn, bilj\b, kokos, vegan, cvarc, pripravak, prip\b, tek\b, masti\b, slag, vrhnje, sir\b, '[0-9]+ ?ml\b',
                   kanta, jog\b, jogurt]
  unit: kg
  min_pack: 200
  max_pack: 3000
  loose_produce: false

mlijeko:
  name: mlijeko
  synonyms: [mlijeko, kravlje mlijeko]
  must_match: [mlijek]
  must_not_match: [loncic, cokolad, cok\b, kakao, sojin, soja, zob, rizin, riza\b, bademov, badem,
                   kokos, vanilij, jagod, banan, kava\b, kave\b, napitak, napolitank, keks,
                   kras\b, bijela cokolada, prahu, zamjen, zamj\b, nan\b, junior, kiselo, jogurt,
                   sir\b, sladoled, puding, kroasan, croissant, bombon, cokoladic, med\b, sun\b,
                   suncanje, disney, dorina, ciste, cisti, pjena za, ukrasn, proteinsk, kefir, kondenz,
                   lgg\b, aktiv, acidofil, acedofil, kis\b, palacink, protein, cokol, set\b, ker\b, keram,
                   # Korak 4B: šlag pjena s mlijekom
                   slag, pjen]
  unit: l
  default_exclude_variants: [laktoza=bez, vrsta_mlijeka=kozje, vrsta_mlijeka=ovcje, vrsta_mlijeka=bivolje]
  # zadano trajno 2,8 %; masnoća 2,8-3,8 % je zamjenjiva (svježe i trajno su zasebne vrste)
  default_attributes: {vrsta: trajno, mast: "2.8"}
  substitutes: {mast: ["2.8", "3.2", "3.5", "3.8"]}
  max_pack: 2000
  min_pack: 500
  plausible_per_unit: [0.3, 4]  # Korak 5A: Milkland 0,39 €/l je stvarna cijena (docs/lidl_raw_check.md)
  attributes:
    mast:
      "0": '(?<![\d.])0(?:\.0)?\s*(%|mm)'
      "0.5": '(?<![\d.])0?\.5\s*(%|mm)'
      "0.9": '(?<![\d.])0?\.9\s*(%|mm)'
      "1.5": '\b1\.5\s*(%|mm)'
      "2.8": '\b2\.8\s*(%|mm)'
      "3.2": '\b3\.2\s*(%|mm)'
      "3.5": '\b3\.5\s*(%|mm)'
      "3.8": '\b3\.8\s*(%|mm)'
    vrsta:
      trajno: '\btrajn|\buht\b|\btr\b'
      svjeze: '\bsvjez|\bsvj\.|\bsv\.'
    laktoza: *laktoza
    vrsta_mlijeka: *vrsta_mlijeka
  value_words: *mlijecne_rijeci
  # Dukatova linija LAGANO JUTRO je mlijeko bez laktoze; naziv to rijetko izričito kaže
  inferred_attributes:
    laktoza:
      bez: 'lagano jutro'
  loose_produce: false

jogurt:
  name: jogurt
  synonyms: [jogurt, tekući jogurt, tekuci jogurt]
  must_match: [jogurt, jog\b]
  must_not_match: [badem, pistacij, ribizl, cimet, vanil, kolac, vocn, voce, jagod, visnj, borovnic,
                   sumsko, vanilij, smoothie, protein, cokolad, keks, musli, zitaric, kokos, breskv,
                   mango, banan, jabuk, ananas, lesnjak, kava\b, aroma, jogobella, frutek]
  unit: kg
  default_exclude_variants: [laktoza=bez, vrsta_mlijeka=kozje, vrsta_mlijeka=ovcje, vrsta_mlijeka=bivolje,
                             vrsta_mlijeka=biljno]
  max_pack: 1000
  min_pack: 150
  attributes:
    vrsta:
      grcki: '\bgrck'
      tekuci: '\btekuc|\btek\.'
      cvrsti: '\bcvrst'
    laktoza: *laktoza
    vrsta_mlijeka: &vrsta_mlijeka_biljno
      <<: *vrsta_mlijeka
      # biljne zamjene (soja, zob, kokos; Alpro, Hopla) samo na zahtjev
      biljno: '\bbiljn|\bsoj|\bzob|\bvegan|\bkokos|\bbadem|\balpro|\bhopla'
    mast:
      "0.1": '(?<![\d.])0?\.1\s*(%|mm)'
