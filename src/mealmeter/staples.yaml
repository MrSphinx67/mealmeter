  must_not_match: [sladil, kiflic, keks, puding, sladoled, krema, napitak]
  unit: kg
  sachet_g: 8
  compare_by: pack
  # jedinica je proizvod kakav se prodaje (broj vrećica iz naziva, inače 1); granice po vrećici (vlasnik,
  # Korak 2D), višestruka pakiranja po vrećici
  plausible_per_pack: [0.10, 1.80]
  loose_produce: false

kakao:
  name: kakao (prah)
  synonyms: [kakao, kakao prah]
  # pozitivno podudaranje: kakao je prva riječ naziva ili piše "kakao prah/u prahu/za kolače"
  # (inače "TORTELA KAKAO", "PRALINE KAKAO", "KRAFNA ... KAKAO" ulaze kao kakao)
