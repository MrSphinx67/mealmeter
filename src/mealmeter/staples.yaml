kocka_za_juhu:
  # Korak 10: koncentrat temeljca (kocke, prah) po kg; recept u ml temeljca preračunava se preko "gustoće"
  # 0,02 g/ml (kocka 10 g za 0,5 l, data/units.yaml), komad je kocka od 10 g. "temeljac" bez oblika bira
  # najjeftiniji od koncentrata i tekućeg temeljca (form_staples), uz upozorenje.
  name: kocka za juhu / temeljac (koncentrat)
  synonyms: [kocka za juhu, kocke za juhu, jušna kocka, jusna kocka, juha kocka, bujon kocka, kocka, temeljac,
             bujon, temeljac u prahu]
  must_match: ['kock[a-z]* za (juh|jel)', 'juh[a-z]* kock', 'kock[a-z]* (goved|kokosj|pilec|pilet|povrt|kraljev|sa mes|s mes)',
               '(goved|kokosj|pilec|pilet|povrt)[a-z]* kock', temeljac, temelj\b, bujon]
  must_not_match: [tekuc, '[0-9]+ ?(ml|l)\b', riblj, skamp, plodov, kozic, rakov, morsk, fant\b, za gulas, za pecen,
                   kotanyi, zacin, sprej, boja, umak, rizoto, tjesten, rezanc]
  keep_defaults: [juha]  # "JUHA-KOCKA MAGGI GOVEĐA" (Spar) je kocka za juhu
  unit: kg
  pantry: true
  min_pack: 40
  max_pack: 1000
  form_staples: {koncentrat: kocka_za_juhu, tekuci: tekuci_temeljac}
  form_words: {koncentrat: [kocka, kocke, kocki, kockica, prah, prahu], tekuci: [tekuci, tekuceg, tekucim]}
  # zadano povrtni; trgovina bez povrtnog: kokošji, goveđi, mesni, pa nepoznatog okusa (default_preference
  # ograničava izbor na navedene vrijednosti, pa su navedene sve)
  default_preference: {okus: [povrtni, kokosji, govedi, mesni, nepoznato]}
  # gel (Podravka "za jela" 4 x 28 g za 0,5 l) treba skoro 3 puta više grama od kocke; samo na zahtjev
  default_exclude_variants: [vrsta=gel, vrsta=nepoznato]
  attributes:
    okus: &okus_temeljca
      povrtni: '\bpovrt|\bpovr\.|\bpovrc|\bvegetab'
      kokosji: '\bkokosj|\bpilec|\bpilet|\bpil\.'
      govedi: '\bgoved'
      mesni: '\bmes[oa]\b|\bmesom'
      _default: nepoznato
    vrsta:
      gel: '\bzelatin|za jela|4x28|\b112 ?g|\b28 ?g'
      prah: '\bprah|\bgranul|\binstant'
      kocka: '\bkock'
      _default: nepoznato
  value_words: &okus_rijeci
    okus:
      povrtni: [povrtni, povrtna, povrtne, povrtnog, povrća, povrca]
      kokosji: [pileći, pileća, pilećeg, pilece, kokošja, kokošjeg, kokosja]
      govedi: [goveđa, goveđeg, govedja, govedina, goveđe]
      mesni: [mesni, mesna, mesa]
  loose_produce: false

