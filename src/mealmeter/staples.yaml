    vrsta:
      smanjeni_natrij: 'manje natrija|smanj\w*\.? udjel\w* natrij|\bnatrij|\bkalij'
      morska: '\bmorsk'
      himalajska: '\bhimalaj'
      kamena: '\bkamen'
      jodirana: '\bjodir'
    zrno:
      sitna: '\bsitn'
      krupna: '\bkrupn'
  loose_produce: false

