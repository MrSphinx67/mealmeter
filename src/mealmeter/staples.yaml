jaja:
  name: jaja
  synonyms: [jaja, jaje, kokošja jaja, kokosja jaja]
  must_match: [jaja\b, jaje\b]
  must_not_match: [desert, quark, igrac, coko, rocher, pistacij, golden, plisan, ferrero, witor,
                   cokolad, zlic, caj, dekorativ, kinder, tije\b, tijest, slicic, iznenad, koleda,
                   cok\b, boja, uskrs, usk\b, uskr\b, set\b, mini\b, kremom, tjestenin, rezanc, mlinc,
                   barilla, tagliatell, milka, salvet, punjen, rezac, marodi, luneta, plava\b, ukras,
                   kalup, prah, ljesnjak, kokos\b, sorini, socado, jajima, pasta, majonez, tj\b, tjest,
                   fidelin, fuz, surl, keks, misura, polje\b, klara\b, bez\b, od svj, liker, puding,
                   krem\b, sendvic, salata, pasteta, namaz, jaja s\b, sa jajima, s jajima,
                   obuc, folij, termoskup, stolic, glazben, igr]
  unit: kom
  # granice po uzgoju (Korak 2D, vlasnik): bio 0,30-1,00 €/kom; ostali 0,08-0,55 €/kom (Korak 4B/4C: Lidlova
  # jaja S i kavezna po 0,09-0,14 €/kom su stvarne cijene; cijena po komadu se ne zaokružuje na cent)
  plausible_by:
    uzgoj: {bio: [0.30, 1.00], _other: [0.08, 0.55]}
  max_pack: 30
  min_pack: 4
  group_by: [velicina, uzgoj]
  # Korak 4C: pri jednakoj cijeni bolji uzgoj; alternativa iste cijene samo uz bolji uzgoj
  quality_rank:
    uzgoj: [bio, slobodni, podni, kavezni, nepoznato]
  # zadano M ili L i uzgoj bolji od kaveznog; zatim M/L ili nepoznata veličina uz nepoznat uzgoj; kavezna i S
  # samo kad trgovina nema drugo (i kao jeftinije alternative, s napomenom)
  preferred_tiers:
    - {velicina: [m, l], uzgoj: [podni, slobodni, bio]}
    - {velicina: [m, l, _none], uzgoj: [podni, slobodni, bio, nepoznato]}
    - {velicina: [m, l, xl, _none]}
  # broj komada: "10/1", "10 KOM" (ne "-18/1-", to je broj pakiranja u kartonu)
  count_regex: '(?<![\d-])(\d+)\s*/\s*1\b(?!\s*-)|(\d+)\s*kom'
  compare_by: count
  attributes:
    velicina:
      # Korak 5A: i u navodnicima ili uz zarez (razred "M", "Jaja iz podnog uzgoja,M,bijel"; attr tekst ima "." za ",")
      xl: '(?:^|[\s(",.„“])xl(?=[\s)",.“”]|$)'
      l: '(?:^|[\s(",.„“])l(?=[\s)",.“”]|$)'
      m: '(?:^|[\s(",.„“])m(?=[\s)",.“”]|$)'
      # "s" je i prijedlog ("JAJE S IGRAČKOM"), pa samo uz razred/vel./kl., u zagradi ili u navodnicima
      s: '(?:razred|raz\.|vel\.?|velicina|kl\.?)\s*["„“]?\s*s\b|\(s\)|["„“]\s*s\s*["“”]|(?:^|\s)s\s+(?:razred|raz\b|kl\b)'
    uzgoj:
      # bio prvi: "EKO JAJA SLOBODNI UZGOJ" je ekološki uzgoj
      bio: '\bbio\b|\beko\b|\bekol'
      kavezni: '\bkavez'
      podni: '\bpodn'
      slobodni: '\bslobodn'
      _default: nepoznato
  loose_produce: false

