# Kategorija lanca (norm_text: mala slova, bez dijakritika i interpunkcije) -> food_group.
# Skupine: hrana, pice, alkohol, kozmetika, higijena, kucanstvo, djeca, kucni_ljubimci, ostalo, unknown.
# 'unknown' znači da kategorija ništa ne govori (npr. "Ostalo" miješa svrdla i gastro hranu):
# takvi proizvodi nasljeđuju skupinu preko EAN-a ili popisa riječi (vidi src/mealmeter/food.py).
# Prijedlog je izrađen pravilima (scripts/make_category_map.py); ispravci se upisuju ovdje.
# Komentar uz redak: broj proizvoda i lanci.

# Ručne iznimke po lancu: hrana iz ovih kategorija (ili naslijeđena preko EAN-a, "ean_inherited")
# provjerava se širim popisom neprehrambenih riječi (food.BROAD_NONFOOD_IN_FOOD), jer lanac u njih
# stavlja i posuđe, krpe i cvijeće (Korak 2D)
_chain_verify:
  gavranovic: [Hrana]
  boso: [ZELENI PROGRAM]
  studenac: [HRANA]
  plodine: [ean_inherited]

